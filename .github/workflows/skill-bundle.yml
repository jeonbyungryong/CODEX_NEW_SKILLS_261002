name: Skill bundle validation and upstream updates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [upstream_skill_update]
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: skill-bundle-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -B scripts/skill_bundle.py validate
      - run: python -B evals/bundle/test_bundle.py
      - run: python -B evals/computer-use-recovery/test_triage.py
      - name: Validate portable drawing reconstruction with synthetic geometry
        run: |
          python -m pip install --disable-pip-version-check "ezdxf>=1.4,<2" "shapely>=2.0,<3" "opencv-python-headless>=4.10,<5" "numpy>=2.1,<3" "Pillow>=11,<12" "PyMuPDF>=1.26,<2"
          python -B skills/image-to-cad/scripts/validate_samples.py
      - name: Parse all upstream YAML on the disposable runner only
        run: |
          python -m pip install --disable-pip-version-check PyYAML==6.0.2
          python -B evals/bundle/check_frontmatter.py

  sync:
    if: contains(fromJSON('["schedule","workflow_dispatch","repository_dispatch"]'), github.event_name)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: upstream-skill-sync
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      UPDATE_BRANCH: automation/upstream-skills
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Preserve and advance the review branch without force-push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin "$UPDATE_BRANCH"; then
            git fetch origin "$UPDATE_BRANCH"
            git switch -c "$UPDATE_BRANCH" FETCH_HEAD
            git merge --no-edit origin/main
          else
            git switch -c "$UPDATE_BRANCH"
          fi
      - name: Import complete selected packages; never execute their code
        run: python -B scripts/skill_bundle.py sync
      - name: Validate candidate before publishing
        run: |
          python -B scripts/skill_bundle.py validate
          python -B evals/bundle/test_bundle.py
          python -B evals/computer-use-recovery/test_triage.py
          python -m pip install --disable-pip-version-check PyYAML==6.0.2
          python -B evals/bundle/check_frontmatter.py
      - name: Publish only package data for human review
        shell: bash
        run: |
          git add -- skills third_party
          if git diff --cached --quiet; then
            echo 'No new upstream package changes.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m 'chore: sync pinned upstream skill packages'
          git push origin "HEAD:$UPDATE_BRANCH"
          compare="https://github.com/$GITHUB_REPOSITORY/compare/main...$UPDATE_BRANCH"
          echo "Validated update branch: $compare" >> "$GITHUB_STEP_SUMMARY"
          existing=$(gh pr list --head "$UPDATE_BRANCH" --state open --json url --jq '.[0].url // empty')
          if [ -n "$existing" ]; then
            echo "Updated existing pull request: $existing" >> "$GITHUB_STEP_SUMMARY"
          elif ! gh pr create --base main --head "$UPDATE_BRANCH" \
            --title 'chore: upstream skill updates (review required)' \
            --body 'Complete packages and provenance hashes updated. Automated checks do not prove instruction safety or runtime compatibility. Review the diff and merge explicitly; installed PCs are unchanged.'; then
            echo '::warning::Repository policy blocked automated PR creation; the validated update branch remains available. Open its compare link manually.'
            echo "PR creation is blocked by repository policy. Open $compare manually." >> "$GITHUB_STEP_SUMMARY"
          fi
